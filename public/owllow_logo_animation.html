<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px;
    background: #ffffff;
  }
  .panel {
    position: relative;
    width: 100%;
    height: 340px;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .panel.light { background: #ffffff; }
  .panel.dark { background: #0d0d0d; }

  .stage {
    position: relative;
    width: 220px;
    height: 260px;
  }

  .logo-img {
    position: absolute;
    left: 50%;
    top: 40px;
    width: 200px;
    height: auto;
    transform: translateX(-50%);
    animation: sway 4s ease-in-out infinite;
    z-index: 2;
  }

  .shadow {
    position: absolute;
    bottom: 20px;
    left: 50%;
    width: 140px;
    height: 26px;
    border-radius: 50%;
    filter: blur(10px);
    transform: translateX(-50%);
    z-index: 1;
    animation: shadowmove 4s ease-in-out infinite;
  }
  .panel.light .shadow {
    background: rgba(0,0,0,0.35);
  }
  .panel.dark .shadow {
    background: rgba(255,255,255,0.28);
  }

  @keyframes sway {
    0%   { transform: translateX(-50%) translateX(-38px) rotate(-6deg); }
    50%  { transform: translateX(-50%) translateX(38px)  rotate(6deg); }
    100% { transform: translateX(-50%) translateX(-38px) rotate(-6deg); }
  }

  @keyframes shadowmove {
    0%   { transform: translateX(-50%) translateX(30px) scaleX(0.85); opacity: 0.55; }
    50%  { transform: translateX(-50%) translateX(-30px) scaleX(1.15); opacity: 0.30; }
    100% { transform: translateX(-50%) translateX(30px) scaleX(0.85); opacity: 0.55; }
  }

  .label {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .panel.light .label { color: #333; }
  .panel.dark .label { color: #ddd; }
</style>
</head>
